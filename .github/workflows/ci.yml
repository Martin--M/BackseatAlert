name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BackseatAlert-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  build-release:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEY_BASE64" ]; then
            echo "Error: ANDROID_KEY_BASE64 is empty. Please set the repository secrets in GitHub."
            exit 1
          fi
          
          echo "$ANDROID_KEY_BASE64" | base64 --decode > release.keystore
          BUILD_TOOLS_PATH=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -1)
          
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Error: No release APK found!"
            exit 1
          fi
          
          $BUILD_TOOLS_PATH/apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass pass:"$ANDROID_KEY_PASSWORD" \
            --out app/build/outputs/apk/release/BackseatAlert-${{ github.ref_name }}.apk \
            "$UNSIGNED_APK"
            
          rm -f release.keystore

      - name: Upload Release APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BackseatAlert-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/BackseatAlert-${{ github.ref_name }}.apk

      - name: Upload APK to Release Assets
        run: gh release upload ${{ github.ref_name }} app/build/outputs/apk/release/BackseatAlert-${{ github.ref_name }}.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
